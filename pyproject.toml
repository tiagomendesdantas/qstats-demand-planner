[project]
name = "qstats-demand-planner"
version = "0.1.0"
description = "Demand forecasting and inventory decision support for multi-channel e-commerce importers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tiago Dantas" }]
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "streamlit>=1.50",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qstats_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"dashboard/*" = ["E402"]
"src/qstats_planner/api/main.py" = ["B008"]
